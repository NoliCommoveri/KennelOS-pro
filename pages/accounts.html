<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accounts — KennelOS</title>
  <link rel="stylesheet" href="../assets/app.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#122138">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KennelOS">
  <style>
    .acct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
    .acct-grid > .acct-card { margin: 0; display: flex; flex-direction: column; gap: 8px; }
    .acct-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .acct-head h2 { margin: 0; font-size: 17px; }
    .acct-site { font-size: 13px; word-break: break-all; }
    .acct-section { border-top: 1px solid var(--border); padding-top: 8px; }
    .acct-section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 4px; }
    .acct-row { display: flex; align-items: center; gap: 8px; min-height: 30px; }
    .acct-k { flex: 0 0 96px; color: var(--text-muted); font-size: 13px; }
    .acct-v { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .acct-secret { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .acct-masked { white-space: nowrap; letter-spacing: .05em; }
    .acct-instructions { white-space: pre-wrap; font-size: 14px; color: var(--text-muted); margin-top: 2px; }
    .acct-actions { margin-top: auto; padding-top: 4px; }
    .acct-k-wide { flex: 0 0 auto; }
    .acct-k-code { flex: 0 0 170px; font-size: 12px; overflow-wrap: anywhere; }
    .cf-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr) auto; gap: 6px; margin-bottom: 6px; }
    .cf-meta { grid-column: 1 / -1; margin: -2px 0 4px; display: flex; gap: 8px; align-items: center; }
    .jf-box { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; margin: 6px 0 10px; }
    .jf-box > summary { cursor: pointer; }
    .pj-row { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); }
    .pj-title { overflow-wrap: anywhere; }
    .fm-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.2fr); gap: 6px 10px; align-items: center; max-height: 55vh; overflow: auto; margin: 8px 0; }
    .fm-grid label { font-size: 14px; }
    @media (max-width: 640px) {
      .pj-row { grid-template-columns: minmax(0,1fr) auto; } .pj-row .pj-title { grid-column: 1 / -1; }
      .fm-grid { grid-template-columns: minmax(0,1fr); } .fm-grid label { margin-top: 6px; }
      .cf-row { grid-template-columns: minmax(0,1fr) auto; }
      .cf-row .cf-type { grid-column: 1; } .cf-row [data-cf-remove] { grid-column: 2; grid-row: 1; }
      .cf-row .cf-label, .cf-row .cf-url { grid-column: 1 / -1; }
      .acct-k-code { flex-basis: 130px; }
    }
  </style>
</head>
<body>
  <div id="app-nav"></div>
  <main>
    <div class="page-header">
      <div>
        <h1>Accounts</h1>
        <p class="page-subtitle">Your business accounts with registries, vendors and services — your logins and member numbers, plus the referral links and codes you share with families.</p>
      </div>
      <div class="pill-row">
        <button class="btn btn-primary" id="btn-add">+ Add Account</button>
      </div>
    </div>
    <nav class="seg-tabs" aria-label="Storage">
      <a class="seg-tab" href="documents.html">Documents</a>
      <a class="seg-tab" href="shows.html">Shows</a>
      <span class="seg-tab active" aria-current="page">Accounts</span>
    </nav>

    <div id="page-msg"></div>

    <div class="list-toolbar" style="margin-top:16px;">
      <input id="search" type="search" placeholder="Search name, username, customer ID, code…">
      <select id="type-filter"></select>
      <label class="check-inline"><input id="show-archived" type="checkbox"> Show archived</label>
    </div>

    <section id="list"></section>
  </main>

  <script type="module" src="../app.js"></script>
  <script type="module" src="./accounts.js"></script>
</body>
</html>
