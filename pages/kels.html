<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kels — KennelOS</title>
  <link rel="stylesheet" href="../assets/app.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#122138">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KennelOS">
</head>
<body class="kels-page">
  <div id="app-nav"></div>
  <main class="kels-main">
    <section class="kels-card" aria-label="Chat with Kels">
      <header class="kels-header">
        <span id="kels-avatar"><span class="kels-avatar kels-avatar-lg" aria-hidden="true">K</span></span>
        <div class="kels-header-text">
          <h1 id="kels-name">Kels, the KennelOS whiz</h1>
        </div>
        <button type="button" class="btn btn-sm" id="kels-later" hidden>Save for later</button>
      </header>
      <div class="kels-transcript" id="kels-transcript" role="log" aria-live="polite"></div>
    </section>
  </main>

  <script type="module" src="../app.js"></script>
  <script type="module" src="./kels.js"></script>
</body>
</html>
