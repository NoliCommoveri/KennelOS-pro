<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kennel Overview and Settings — KennelOS</title>
  <link rel="stylesheet" href="../assets/app.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#122138">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KennelOS">
</head>
<body>
  <div id="app-nav"></div>
  <main>
    <div class="page-header">
      <div>
        <a class="muted" href="kennels.html">← All kennels</a>
        <h1 id="kennel-title">Kennel Overview and Settings</h1>
        <div id="kennel-subtitle" class="page-subtitle"></div>
        <div id="kennel-scope"></div>
      </div>
    </div>

    <div id="page-error"></div>

    <!-- One card at a time (decided 2026-10-08): pick a section from the dropdown,
         alphabetical; every card below carries data-ks="<section>" and only the
         chosen one shows. A #<section> hash opens that one (the Waitlist page's
         Settings links #waitlist-settings). -->
    <div id="kennel-section-picker"></div>

    <!-- Logo: a stored image (data URL on the Kennel record) shown on this
         kennel's invoices, receipts, and puppy records. Any kennel may carry one. -->
    <div id="logo-section" data-ks="logo"></div>

    <!-- Per-kennel hub (Multi-Kennel Scope Spec §8): Roster, Active litters, Recent
         placements, Finances. Own kennels only; always about THIS kennel, never the
         active scope. -->
    <div id="kennel-overview"></div>

    <!-- Kennel card (End-State guide §28): this kennel's portable public ID and
         the link/code that hands it to another breeder. Own kennels only; an
         outside kennel that arrived via a card shows the ID it came with. -->
    <div id="kennel-card-section" data-ks="card"></div>

    <!-- Own-kennel program configuration: Lifecycle nudges, Preferred tests,
         Feeding schedules, Waitlist settings. Empty for an outside kennel. -->
    <div id="kennel-config"></div>

    <!-- Kennel-wide expenses (subject_type='kennel') — overhead not tied to one
         dog/litter: facility, bulk food, registration dues, marketing, etc. -->
    <section id="expenses-section" data-ks="expenses"></section>
  </main>

  <script type="module" src="../app.js"></script>
  <script type="module" src="./kennel.js"></script>
</body>
</html>
