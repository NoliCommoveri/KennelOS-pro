<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Location / Status Board — KennelOS</title>
  <link rel="stylesheet" href="../assets/app.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#122138">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KennelOS">
</head>
<body>
  <div id="app-nav"></div>
  <main>
    <div class="page-header">
      <div>
        <h1>Location / Status Board</h1>
        <p class="page-subtitle">Every dog currently away from home (boarding stays and in-person stud services — active medications and heat cycles don't appear here), and the dogs staying with you (deferred pickups, extended stays, visiting studs).</p>
      </div>
    </div>
    <section class="card">
      <h2 style="margin-top:0;">Away from home</h2>
      <div id="board-mount"></div>
    </section>
    <section class="card" style="margin-top:16px;">
      <h2 style="margin-top:0;">Staying with us</h2>
      <div id="with-us-mount"></div>
    </section>
  </main>

  <script type="module" src="../app.js"></script>
  <script type="module" src="./board.js"></script>
</body>
</html>
